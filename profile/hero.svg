<svg xmlns="http://www.w3.org/2000/svg" width="960" height="280" viewBox="0 0 960 280" fill="none" role="img" aria-labelledby="title description">
  <title id="title">HeyX. From first request to service.</title>
  <desc id="description">A teal banner with the HeyX logo and connected paths, inspired by heyx.app.</desc>
  <defs>
    <linearGradient id="background" x1="180" y1="280" x2="960" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#007F75"/>
      <stop offset="0.6" stop-color="#00A195"/>
      <stop offset="1" stop-color="#A8E0DA"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" stroke="#FFFFFF" stroke-opacity="0.07"/>
    </pattern>
    <mask id="logo-cut">
      <rect width="78" height="42" fill="white"/>
      <rect y="14.5" width="78" height="1.5" fill="black"/>
      <rect y="18" width="78" height="1.5" fill="black"/>
      <rect y="21.5" width="78" height="1.5" fill="black"/>
      <rect y="25" width="78" height="1.5" fill="black"/>
    </mask>
  </defs>
  <path fill="url(#background)" d="M0 0H960V280H0z"/>
  <path fill="url(#grid)" d="M0 0H960V280H0z"/>
  <path d="M520 280 800 0H960L680 280Z" fill="#FFFFFF" fill-opacity="0.05"/>
  <g stroke="#D7F3EF" stroke-opacity="0.3">
    <path d="M570 0V46L638 114H756L870 228H960"/>
    <path d="M610 280V226L700 136H806L912 30V0"/>
    <path d="M720 0V54L840 174H960"/>
    <path d="M500 280 552 228H690L744 174"/>
  </g>
  <g fill="#D7F3EF">
    <circle cx="638" cy="114" r="4"/>
    <circle cx="744" cy="174" r="5"/>
    <circle cx="870" cy="228" r="4"/>
  </g>
  <rect x="48" y="24" width="102" height="64" fill="#FFFFFF"/>
  <g transform="translate(60 35)" mask="url(#logo-cut)" fill="#1a1f1e">
    <rect y="1" width="10" height="40"/>
    <rect y="17" width="28" height="8"/>
    <rect x="18" y="1" width="10" height="40"/>
    <rect x="18" y="1" width="30" height="8"/>
    <rect x="18" y="17" width="26" height="8"/>
    <rect x="18" y="33" width="30" height="8"/>
    <polygon points="40,1 54,1 66,25 56,25"/>
    <polygon points="78,1 64,1 44,41 54,41"/>
    <polygon points="60.7,33.8 66.6,24.2 78,41 66,41" fill="#00A195"/>
  </g>
  <g fill="#FFFFFF" font-family="'IBM Plex Sans', Arial, sans-serif">
    <text x="48" y="151" font-size="52" font-weight="600" letter-spacing="-1.5">From first request</text>
    <text x="48" y="211" font-size="52" font-weight="600" letter-spacing="-1.5">to service.</text>
  </g>
</svg>
